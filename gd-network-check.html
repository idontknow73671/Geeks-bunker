<!doctype html><html lang="en"><meta charset="utf-8"><title>Geometry Dash level connection check</title><style>body{font:18px system-ui;background:#16191e;color:#eee;padding:32px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Geometry Dash online levels</h1><p>This check requests the public featured-level list through Geekfox, without loading or altering a player's save.</p><button id="check">Check uploaded levels</button><pre id="result" role="status">Ready</pre><script src="geekfox-engine.js"></script><iframe id="port" title="Level check" hidden></iframe><script type="module">
import {withGdNetwork,gdNetworkRoutes} from './g8me-network.js';
const result=document.querySelector('#result');
window.__gbGdNetworkFetch=async(target,options)=>{const runtime=await GeekfoxEngine.startG8mes();return runtime.fetch(gdNetworkRoutes(target)[0],options);};
window.addEventListener('message',event=>{if(event.source===document.querySelector('#port').contentWindow)result.textContent=event.data.result;});
document.querySelector('button').onclick=()=>{
result.textContent='Checking the same network adapter used by the port…';
document.querySelector('#port').srcdoc=withGdNetwork(`<html><head></head><body><script>
(async()=>{try{
const options={method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'}};
const response=await fetch('/__proxy?url='+encodeURIComponent('https://www.boomlings.com/database/getGJLevels21.php'),{...options,body:'secret=Wmfd2893gb7&type=6&page=0&gameVersion=22&binaryVersion=45'});
const text=await response.text();const id=text.match(/^1:(\\d+):2:([^:]+)/);if(!response.ok||!id)throw Error('Level list failed: HTTP '+response.status);
const download=await fetch('/__proxy?url='+encodeURIComponent('https://www.boomlings.com/database/downloadGJLevel22.php'),{...options,body:'secret=Wmfd2893gb7&gameVersion=22&binaryVersion=45&levelID='+id[1]});
const data=await download.text();if(!download.ok||!data.includes(':4:'))throw Error('Level download failed: HTTP '+download.status+' '+data.slice(0,80));
parent.postMessage({result:'PASS — uploaded-level list and level download work\\nFeatured level: '+id[2]+' (#'+id[1]+')\\nList: HTTP '+response.status+' · '+text.length.toLocaleString()+' characters\\nLevel: HTTP '+download.status+' · '+data.length.toLocaleString()+' characters\\nNo player save data was read or changed.'},'*');
}catch(error){parent.postMessage({result:error.message},'*');}})();
<\/script></body></html>`,{provider:'gn',id:868});};
</script></html>
