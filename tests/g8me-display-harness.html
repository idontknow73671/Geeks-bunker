<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G8me aspect-ratio verification</title><style>*{box-sizing:border-box}body{margin:0;background:#141922;color:white;font:14px system-ui}header{height:58px;padding:12px;display:flex;align-items:center;gap:20px}button{padding:9px}#host{position:relative;overflow:hidden;background:black;width:100%;height:calc(100dvh - 58px)}#host:fullscreen{height:100dvh}iframe{width:100%;height:100%;display:block;border:0}</style><header><button id="full">Fullscreen</button><span id="report">Loading fixed 640×480 canvas</span></header><section id="host"><iframe title="640 by 480 g8me" id="frame"></iframe></section><script type="module">
import {attachG8meDisplay} from '../g8me-display.js';
const frame=document.getElementById('frame'),host=document.getElementById('host');attachG8meDisplay(frame,host);
frame.srcdoc=`<style>body{margin:8px;background:#202833}canvas{display:block;margin:auto}</style><canvas width="640" height="480" id="canvas"></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');x.fillStyle='#273e50';x.fillRect(0,0,640,480);x.strokeStyle='#9ce28a';x.lineWidth=5;x.strokeRect(3,3,634,474);x.beginPath();x.arc(320,240,150,0,Math.PI*2);x.stroke();x.fillStyle='white';x.textAlign='center';x.font='24px sans-serif';x.fillText('640 × 480 — 4:3',320,50);x.fillText('Click the center',320,440);c.onclick=e=>{x.fillStyle='#273e50';x.fillRect(150,400,340,60);x.fillStyle='white';x.fillText(Math.round(e.offsetX)+', '+Math.round(e.offsetY),320,440);};<\/script>`;
document.getElementById('full').onclick=()=>host.requestFullscreen();
const report=()=>{const r=frame.getBoundingClientRect();document.getElementById('report').textContent='Displayed '+Math.round(r.width)+' × '+Math.round(r.height)+' · ratio '+(r.width/r.height).toFixed(3);};
new ResizeObserver(()=>setTimeout(report,50)).observe(host);new ResizeObserver(report).observe(frame);
</script></html>
