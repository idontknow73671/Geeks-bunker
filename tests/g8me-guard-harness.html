<!doctype html><meta charset="utf-8"><base href="../"><title>G8me ad and popup verification</title><style>body{background:#131820;color:white;font:16px system-ui;padding:20px}button{padding:12px}iframe{display:block;width:100%;height:300px;background:white;border:0;margin-top:20px}</style><h1>G8me ad and popup checks</h1><button id="toggle">Ad blocker: On</button><p id="status"></p><iframe id="frame" title="Test g8me"></iframe><script type="module">
import {createG8meGuard,g8meFrameSandbox} from '../g8me-guard.js';
const frame=document.getElementById('frame'),guard=createG8meGuard({button:document.getElementById('toggle'),status:document.getElementById('status'),reload:()=>location.reload()});await guard.prepare();frame.setAttribute('sandbox',g8meFrameSandbox(guard.enabled));frame.srcdoc=guard.protectHTML(`<html><head><script src="https://www.google-analytics.com/analytics.js"><\/script></head><body><h2>Playable test area</h2><button id="test">Try ad popup</button><p id="result">Waiting</p><button id="score">Add point</button><p id="points">0 points</p><script>document.getElementById('test').onclick=()=>{document.getElementById('result').textContent=window.open('/ad-test')===null?'Popup blocked':'Popup escaped';};let points=0;document.getElementById('score').onclick=()=>document.getElementById('points').textContent=++points+' points';<\/script></body></html>`,'https://g8me.example/');
</script>
